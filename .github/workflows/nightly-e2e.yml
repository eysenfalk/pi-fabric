name: Nightly E2E

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

jobs:
  model-free-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Agent TTY
        run: npm install --global agent-tty@0.5.0
      - name: Deterministic repository gate
        run: bun run check
      - name: Model-free end-to-end suite
        run: bun run test:e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e
          path: .artifacts/e2e/
          if-no-files-found: warn
