name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install ripgrep
        # pi's grep tool downloads rg on first use when it is absent; on shared
        # runners that ad-hoc GitHub Releases download is rate-limited, so
        # provision rg on PATH up front to keep nested-grep tests hermetic.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
          else
            sudo apt-get install -y ripgrep
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Test Windows type-checker regression
        if: runner.os == 'Windows'
        run: bunx vitest run tests/type-checker.test.ts
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: Lint (dead code)
        run: bun run lint:dead

  implement-e2e:
    name: Implement TUI E2E (model-free)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Agent TTY
        run: npm install --global agent-tty@0.5.0
      - name: Build
        run: bun run build
      - name: Test /implement through Pi TUI
        run: bun run test:e2e:implement
      - name: Upload TUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implement-tui-e2e
          path: .artifacts/e2e/implement-tui/
          if-no-files-found: warn
